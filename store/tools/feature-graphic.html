<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: radial-gradient(circle at 18% 30%, #3B2C86 0%, #21195A 50%, #110D33 100%);
    font-family: Inter, sans-serif; color: #fff; position: relative;
  }
  .text { position: absolute; left: 64px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  h1 { font-family: Lora, serif; font-weight: 500; font-size: 76px; margin: 0; letter-spacing: -0.5px; }
  p { font-size: 25px; line-height: 1.45; margin: 26px 0 0; color: #DCD6F7; max-width: 480px; }
  .phone {
    position: absolute; right: 70px; top: 48px; width: 300px; height: 533px;
    border-radius: 34px; background: #0e1a33; padding: 10px;
    box-shadow: 0 20px 50px rgba(0,0,0,.45); transform: rotate(4deg);
  }
  .phone img { width: 100%; border-radius: 26px; display: block; }
</style></head><body>
  <div class="text">
    <div class="brand"><img src="ICON"><h1>Stemma</h1></div>
    <p>Where every word comes from, in every language. From Wiktionary, the free dictionary.</p>
  </div>
  <div class="phone"><img src="SHOT"></div>
</body></html>
